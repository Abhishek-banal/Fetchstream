name: FetchStream Cloud Runner

on:
  repository_dispatch:
    types: [server_relay]
  workflow_dispatch:
    inputs:
      media_url:
        description: 'Target Media / M3U8 Stream URL'
        required: true
      file_name:
        description: 'Output File Name'
        required: false
        default: 'video.mp4'
      type:
        description: 'Media Type (hls or direct)'
        required: false
        default: 'hls'
      service:
        description: 'Destination Upload Service (gofile.io, buzzheavier.com, pixeldrain.com, catbox.moe, FFast, storage.to, s3_compatible, hf_buckets, telegram, all)'
        required: false
        default: 'gofile.io'
      description:
        description: 'Telegram Caption / Video Description'
        required: false
        default: ''
      job_id:
        description: 'Job Identifier'
        required: false
        default: 'manual_run'
      callback_url:
        description: 'Edge Provider Callback URL'
        required: false
        default: ''
      proxy_url:
        description: 'Edge Provider Proxy Fallback URL'
        required: false
        default: ''
      use_fallback_proxy:
        description: 'Use Edge Provider Fallback Proxy on 403'
        required: false
        default: 'true'
      threads:
        description: 'Parallel Download Threads (2 to 24)'
        required: false
        default: '8'

jobs:
  server_relay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/${{ github.repository_owner }}/fetchstream-runner-env:latest
      options: --user root

    services:
      telegram-bot-api:
        image: aiogram/telegram-bot-api:latest
        env:
          TELEGRAM_API_ID: ${{ secrets.TG_API_ID || '6' }}
          TELEGRAM_API_HASH: ${{ secrets.TG_API_HASH || 'eb06d4abfb49dc3eeb1aeb98ae0f581e' }}
          TELEGRAM_LOCAL: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Server-Side Download and Upload
        env:
          JOB_ID: ${{ github.event.client_payload.jobId || inputs.job_id }}
          MEDIA_URL: ${{ github.event.client_payload.mediaUrl || inputs.media_url }}
          HEADERS_JSON: ${{ toJson(github.event.client_payload.headers) }}
          FILE_NAME: ${{ github.event.client_payload.config.fileName || github.event.client_payload.fileName || inputs.file_name }}
          TYPE: ${{ github.event.client_payload.config.type || github.event.client_payload.type || inputs.type }}
          FORMAT: ${{ github.event.client_payload.config.format || github.event.client_payload.format || 'mp4' }}
          SERVICE: ${{ github.event.client_payload.config.service || github.event.client_payload.service || inputs.service }}
          THREADS: ${{ github.event.client_payload.config.threads || github.event.client_payload.threads || inputs.threads || '8' }}
          CREDENTIALS_JSON: ${{ toJson(github.event.client_payload.credentials) }}
          INPUT_DESC: ${{ github.event.client_payload.description || inputs.description || '' }}
          CALLBACK_URL: ${{ github.event.client_payload.callbackUrl || inputs.callback_url }}
          PROXY_URL: ${{ github.event.client_payload.proxyConfig.url || github.event.client_payload.proxyUrl || inputs.proxy_url }}
          USE_FALLBACK_PROXY: ${{ github.event.client_payload.proxyConfig.useFallback || github.event.client_payload.useFallbackProxy || inputs.use_fallback_proxy }}
          AUDIO_ONLY: ${{ github.event.client_payload.config.audioOnly || github.event.client_payload.audioOnly }}
          TG_API_ID: ${{ secrets.TG_API_ID || '6' }}
          TG_API_HASH: ${{ secrets.TG_API_HASH || 'eb06d4abfb49dc3eeb1aeb98ae0f581e' }}
        shell: bash
        run: |
          
          python3 -c '
          import json, os
          try:
              creds = json.loads(os.environ.get("CREDENTIALS_JSON", "{}"))
              for k, v in creds.items():
                  if isinstance(v, str) and len(v) > 2:
                      print(f"::add-mask::{v}")
          except Exception: pass
          '
          
          
          CREDS="$CREDENTIALS_JSON"
          if [ -n "$INPUT_DESC" ] && [ "$CREDS" != "null" ] && [ -n "$CREDS" ]; then
            export CREDENTIALS_JSON=$(python3 -c 'import json, os; d = json.loads(os.environ.get("CREDENTIALS_JSON") or "{}"); d["description"] = os.environ.get("INPUT_DESC"); print(json.dumps(d))')
          elif [ -n "$INPUT_DESC" ]; then
            export CREDENTIALS_JSON=$(python3 -c 'import json, os; print(json.dumps({"description": os.environ.get("INPUT_DESC")}))')
          fi
          
          
          CMD_ARGS=(
            --job-id "$JOB_ID"
            --media-url "$MEDIA_URL"
            --headers-json "$HEADERS_JSON"
            --file-name "$FILE_NAME"
            --type "$TYPE"
            --format "$FORMAT"
            --service "$SERVICE"
            --threads "$THREADS"
            --callback-url "$CALLBACK_URL"
            --proxy-url "$PROXY_URL"
            --use-fallback "$USE_FALLBACK_PROXY"
            --max-file-size-gb "0"
          )
          
          if [ "$AUDIO_ONLY" = "true" ]; then
            CMD_ARGS+=(--audio-only)
          fi

          apt-get update && apt-get install -y curl
          python server_uploader.py "${CMD_ARGS[@]}"