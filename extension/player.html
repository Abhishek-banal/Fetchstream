<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FetchStream Player</title>
    <script src="js/hls-player.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; max-height: 100vh; outline: none; }
        #error { color: white; font-family: sans-serif; position: absolute; top: 20px; left: 20px; z-index: 10; display: none; background: rgba(255,0,0,0.7); padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="error"></div>
    <video id="video" controls autoplay></video>
    <script src="js/options.js"></script>
    <script src="js/player.js"></script>
</body>
</html>
